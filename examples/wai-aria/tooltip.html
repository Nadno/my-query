<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAI-ARIA — Tooltip</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1a;
        --fg: #fff;
        --line: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tooltip</h1>
      <p>passe o mouse, ou tab, para ver.</p>
      <div id="app"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mini-q": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/index.js",
          "mini-q/style": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/style.js",
          "mini-q/adapters/preact": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/adapters/preact.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.4/dist/signals-core.mjs"
        }
      }
    </script>

    <script type="module">
      import $, { $mount, $useSignal } from 'mini-q';
      import { preact } from 'mini-q/adapters/preact';
      import { style } from 'mini-q/style';
      import { signal } from '@preact/signals-core';

      $useSignal(preact);

      style.css('body', {
        margin: 0,
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        background: 'var(--bg)',
        color: 'var(--fg)',
        lineHeight: 1.6,
        padding: '2rem 1rem',
      });
      style.css('*', { boxSizing: 'border-box' });
      style.css('main', { maxWidth: 720, margin: '0 auto' });

      const theme = style('tooltip', {
        parts: {
          wrap: { position: 'relative', display: 'inline-block', margin: '1rem 1rem 3rem 0' },
          btn: {
            padding: '10px 14px',
            border: '1px solid var(--line)',
            borderRadius: 8,
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--fg)',
            cursor: 'pointer',
          },
          tip: {
            position: 'absolute',
            bottom: 'calc(100% + 8px)',
            left: 0,
            padding: '8px 10px',
            borderRadius: 6,
            background: '#fff',
            color: '#111',
            fontSize: '0.85rem',
            boxShadow: '0 4px 14px rgba(0,0,0,0.5)',
            display: 'none',
            '&[data-show="true"]': { display: 'block' },
          },
        },
      });

      /** Tooltip: role=tooltip + aria-describedby no trigger; mostra no hover (custom event) e no foco. */
      function Tooltip({ label, tip }) {
        const id = `tip-${label.replace(/\W+/g, '-').toLowerCase()}`;
        const show = signal(false);

        return $.span(
          { class: theme.wrap },
          $.button(
            {
              type: 'button',
              class: theme.btn,
              $aria: { describedBy: id },
              on: {
                hover: (e) => {
                  show.value = true;
                  // cleanup: ao sair do hover, esconde
                  return () => (show.value = false);
                },
                focusin: () => (show.value = true),
                focusout: () => (show.value = false),
              },
            },
            label,
          ),
          $.span(
            { role: 'tooltip', id, class: theme.tip, $data: { show: () => String(show.value) } },
            tip,
          ),
        );
      }

      const App = () =>
        $.div(
          { class: theme },
          Tooltip({ label: 'Imprimir', tip: 'Exporta a página em PDF.' }),
          Tooltip({ label: 'Salvar rascunho', tip: 'Mantém o texto mesmo se fechar.' }),
        );

      $mount('#app', App);
    </script>
  </body>
</html>
