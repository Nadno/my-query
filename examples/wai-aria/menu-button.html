<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAI-ARIA — Menu Button</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1a;
        --fg: #fff;
        --line: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Menu Button</h1>
      <p style="color:rgba(255,255,255,.7)">Abre com clique, Enter/espaço ou seta ↓. Setas movem, Esc fecha, clique fora fecha.</p>
      <div id="app"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mini-q": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/index.js",
          "mini-q/style": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/style.js",
          "mini-q/aria": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/aria.js",
          "mini-q/adapters/preact": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/adapters/preact.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.4/dist/signals-core.mjs"
        }
      }
    </script>

    <script type="module">
      import $, { $mount, $useSignal, $when, $handle } from 'mini-q';
      import { preact } from 'mini-q/adapters/preact';
      import { style } from 'mini-q/style';
      import { signal } from '@preact/signals-core';
      import { useRoving, escClose } from './aria-utils.js';

      $useSignal(preact);

      style.css('body', {
        margin: 0,
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        background: 'var(--bg)',
        color: 'var(--fg)',
        lineHeight: 1.6,
        padding: '2rem 1rem',
      });
      style.css('*', { boxSizing: 'border-box' });
      style.css('main', { maxWidth: 720, margin: '0 auto' });

      const theme = style('menu-button', {
        parts: {
          trigger: {
            padding: '10px 14px',
            border: '1px solid var(--line)',
            borderRadius: 8,
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--fg)',
            cursor: 'pointer',
          },
          menu: {
            position: 'absolute',
            zIndex: 10,
            minWidth: 180,
            marginTop: 4,
            border: '1px solid var(--line)',
            borderRadius: 8,
            background: '#222',
            boxShadow: '0 8px 24px rgba(0,0,0,0.5)',
            display: 'grid',
            padding: 4,
          },
          item: {
            border: 'none',
            background: 'none',
            color: 'var(--fg)',
            font: 'inherit',
            textAlign: 'left',
            padding: '8px 10px',
            borderRadius: 6,
            cursor: 'pointer',
            '&.active, &:hover': { background: 'rgba(255,255,255,0.08)' },
            '&:focus-visible': { outline: '2px solid #fff', outlineOffset: -2 },
          },
          wrap: { position: 'relative', display: 'inline-block' },
          status: { marginTop: '1rem', color: 'rgba(255,255,255,0.7)' },
        },
      });

      const open = signal(false);
      const value = signal('nenhum');

      const ITEMS = [
        { label: 'Novo arquivo' },
        { label: 'Abrir…' },
        { label: 'Salvar' },
        { label: 'Salvar como…' },
      ];

      const close = () => (open.value = false);

      const Menu = () => {
        const menu = $.div(
          {
            role: 'menu',
            'aria-label': 'Arquivo',
            class: theme.menu,
            on: {
              // Esc fecha o menu (modificador $handle.keys + prevent)
              keydown: escClose(close),
            },
          },
          ...ITEMS.map((item, i) =>
            $.button(
              {
                role: 'menuitem',
                type: 'button',
                tabIndex: i === 0 ? 0 : -1,
                class: theme.item,
                on: {
                  click: () => {
                    value.value = item.label;
                    close();
                  },
                },
              },
              item.label,
            ),
          ),
        );

        useRoving(menu, {
          target: '[role=menuitem]',
          orientation: 'vertical',
          loop: true,
        });

        return menu;
      };

      const App = () =>
        $.div(
          { class: theme },
          $.span(
            {
              class: theme.wrap,
              // custom event nativo: enter no 1º pointerdown fora, leave em dentro
              on: { interactOutside: close },
            },
            $.button(
              {
                type: 'button',
                id: 'menu-trigger',
                class: theme.trigger,
                'aria-haspopup': 'menu',
                $aria: { expanded: open },
                on: {
                  click: () => (open.value = !open.value),
                  // setas ↓↑ abrem e focam o primeiro item (modificadores do $handle)
                  keydown: [
                    (e) => {
                      open.value = true;
                      requestAnimationFrame(() => {
                        document.querySelector('[role=menu] [role=menuitem]')?.focus();
                      });
                    },
                    $handle.keys('ArrowDown', 'ArrowUp'),
                    $handle.prevent,
                  ],
                },
              },
              'Arquivo ▾',
            ),
            $when(open, () => Menu()),
          ),
          $.p({ class: [theme.status, 'status'], 'aria-live': 'polite' }, 'Última ação: ', () => value.value),
        );

      $mount('#app', App);
    </script>
  </body>
</html>
