<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAI-ARIA — Disclosure</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1a;
        --fg: #fff;
        --line: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.6;
        padding: 2rem 1rem;
      }
      main { max-width: 720px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Disclosure</h1>
      <div id="app"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mini-q": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/index.js",
          "mini-q/style": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/style.js",
          "mini-q/adapters/preact": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/adapters/preact.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.4/dist/signals-core.mjs"
        }
      }
    </script>

    <script type="module">
      import $, { $mount, $useSignal, $show } from 'mini-q';
      import { preact } from 'mini-q/adapters/preact';
      import { signal } from '@preact/signals-core';
      import { style } from 'mini-q/style';

      $useSignal(preact);

      const faq = style('faq', {
        display: 'grid',
        gap: 8,
        '>item': {
          border: '1px solid var(--line)',
          borderRadius: 10,
          background: 'rgba(255,255,255,.03)',
        },
        '>button': {
          width: '100%',
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          gap: 12,
          padding: '12px 16px',
          background: 'none',
          border: 'none',
          color: 'var(--fg)',
          font: 'inherit',
          fontSize: '1rem',
          textAlign: 'left',
          cursor: 'pointer',
          '&:hover': { background: 'rgba(255,255,255,.04)' },
        },
        '>icon': {
          transition: 'transform .2s ease',
          flags: { open: { transform: 'rotate(45deg)' } },
        },
        '>panel': {
          padding: '0 16px 16px',
          color: 'rgba(255,255,255,.7)',
        },
      });

      /** Um item de disclosure — rota do padrão WAI-ARIA (`expanded` + `region`). */
      function DisclosureItem({ index, title, content }) {
        const open = signal(index === 0);

        const panelId = `disclosure-panel-${index}`;
        const buttonId = `disclosure-button-${index}`;

        return $.div(
          { class: faq.item },
          $.button(
            { id: buttonId, type: 'button', class: faq.button, $aria: { expanded: open, controls: panelId },
              on: { click: () => (open.value = !open.value) } },
            title,
            $.span({ $class: () => faq.icon({ open: open.value }), 'aria-hidden': true }, '+'),
          ),
          $.div(
            { id: panelId, role: 'region', class: faq.panel, aria: { labelledBy: buttonId }, use: $show(open) },
            content,
          ),
        );
      }

      const ITEMS = [
        { title: 'O que é o mini-q?', content: 'Uma lib sem build/JSX para DOM e reatividade granular, plugando qualquer lib de signal via adapter.' },
        { title: 'Preciso de build?', content: 'Não para desenvolvimento nem para abrir estes exemplos: o diretório dist/ é publicado e importado via CDN.' },
        { title: 'Como funciona o $ em props?', content: 'Qualquer prop com prefixo $ recebe um signal ou função e reage de forma granular.' },
      ];

      const App = () => $.div({ class: faq }, ...ITEMS.map((item, index) => DisclosureItem({ ...item, index })));

      $mount('#app', App);
    </script>
  </body>
</html>
