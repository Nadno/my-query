<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAI-ARIA — Dialog</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1a1a1a;
        --fg: #fff;
        --line: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dialog (Modal)</h1>
      <div id="app"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "mini-q": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/index.js",
          "mini-q/style": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/style.js",
          "mini-q/aria": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/aria.js",
          "mini-q/adapters/preact": "https://cdn.jsdelivr.net/gh/Nadno/my-query@feat/mini-q/dist/adapters/preact.js",
          "@preact/signals-core": "https://cdn.jsdelivr.net/npm/@preact/signals-core@1.14.4/dist/signals-core.mjs"
        }
      }
    </script>

    <script type="module">
      import $, { $mount, $useSignal, $when, $useTeleport, $onMounted, $onUnmounted } from 'mini-q';
      import { preact } from 'mini-q/adapters/preact';
      import { style } from 'mini-q/style';
      import { FocusScope } from 'mini-q/aria';
      import { signal } from '@preact/signals-core';
      import { escClose } from './aria-utils.js';

      $useSignal(preact);

      style.css('body', {
        margin: 0,
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        background: 'var(--bg)',
        color: 'var(--fg)',
        lineHeight: 1.6,
        padding: '2rem 1rem',
      });
      style.css('*', { boxSizing: 'border-box' });
      style.css('main', { maxWidth: 720, margin: '0 auto' });

      const theme = style('dialog', {
        parts: {
          trigger: {
            padding: '10px 16px',
            border: '1px solid var(--line)',
            borderRadius: 8,
            background: 'rgba(255,255,255,0.04)',
            color: 'var(--fg)',
            cursor: 'pointer',
          },
          overlay: {
            position: 'fixed',
            inset: 0,
            background: 'rgba(0,0,0,0.6)',
            display: 'grid',
            placeItems: 'center',
            zIndex: 100,
          },
          dialog: {
            width: 'min(90%, 420px)',
            border: '1px solid var(--line)',
            borderRadius: 12,
            background: '#222',
            padding: '1.5rem',
            boxShadow: '0 12px 40px rgba(0,0,0,0.6)',
          },
          title: { margin: '0 0 0.5rem' },
          actions: {
            display: 'flex',
            gap: 8,
            justifyContent: 'flex-end',
            marginTop: '1.5rem',
            '& button': {
              padding: '8px 14px',
              border: '1px solid var(--line)',
              borderRadius: 8,
              background: 'rgba(255,255,255,0.06)',
              color: 'var(--fg)',
              cursor: 'pointer',
            },
            '& button[data-primary]': { background: '#3b82f6', borderColor: 'transparent' },
          },
        },
      });

      const open = signal(false);
      const confirmed = signal(false);

      const close = () => (open.value = false);

      const Dialog = () => {
        let scope = null;

        // $onMounted roda com o nó já conectado (pós-montagem) — ativa o FocusScope aqui
        $onMounted(() => {
          const el = document.getElementById('confirm-dialog');
          if (el) {
            scope = FocusScope.of(el, { autoFocus: true, isolate: true, trap: true }).activate();
          }
        });

        $onUnmounted(() => {
          scope?.deactivate();
          scope = null;
        });

        return $.div(
          {
            class: theme.overlay,
            on: {
              // clique no backdrop (fora do próprio dialog) fecha
              click: (e) => { if (e.target === e.currentTarget) close(); },
            },
          },
          $.div(
            {
              id: 'confirm-dialog',
              role: 'dialog',
              'aria-modal': 'true',
              'aria-labelledby': 'dial-title',
              'aria-describedby': 'dial-desc',
              class: theme.dialog,
              on: {
                // Esc fecha o modal (`escClose` amarra $handle.keys + prevent)
                keydown: escClose(close),
              },
            },
            $.h2({ id: 'dial-title', class: theme.title }, 'Confirmação'),
            $.p({ id: 'dial-desc' }, 'Tem certeza que quer continuar?'),
            $.div(
              { class: theme.actions },
              $.button({ type: 'button', on: { click: close } }, 'Cancelar'),
              $.button({
                type: 'button',
                data: { primary: '' },
                on: {
                  click: () => {
                    confirmed.value = true;
                    close();
                  },
                },
              }, 'Confirmar'),
            ),
          ),
        );
      };

      const App = () =>
        $.div(
          $.button(
            { type: 'button', class: theme.trigger, on: { click: () => (open.value = true) } },
            'Abrir diálogo',
          ),
          $.p({ 'aria-live': 'polite' }, () => (confirmed.value ? 'Confirmado!' : 'Nada confirmado ainda.')),

          // modal teleportado e montado apenas quando aberto
          $when(open, () => $.div({ class: theme, use: $useTeleport('body') }, Dialog())),
        );

      $mount('#app', App);
    </script>
  </body>
</html>
